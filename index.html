<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抖音逐字稿库</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FAF9F6; --card:#fff; --line:#E7E5E4; --ink:#1C1917;
  --dim:#78716C; --faint:#A8A29E; --accent:#B45309; --soft:#F3F1EC;
  --serif:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
body{background:var(--paper);color:var(--ink);font:15px/1.7 var(--sans);
 -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 48px 40px}

header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;height:76px;
 border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:inherit}
.brand:hover{text-decoration:none}
.brand .mark{width:34px;height:34px;background:var(--accent);border-radius:8px;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .nm{font:600 19px var(--serif);color:var(--ink);letter-spacing:.01em}
header.top .sp{flex:1}
nav.nav{display:flex;gap:26px;align-items:center}
nav.nav a{font-size:14px;color:var(--dim);text-decoration:none}
nav.nav a:hover{color:var(--ink);text-decoration:none}
nav.nav a.on{color:var(--accent);font-weight:500}

.masthead{padding:58px 0 42px;border-bottom:1px solid var(--line)}
.mh-title{font:700 46px/1.28 var(--serif);letter-spacing:-.02em;margin-bottom:14px}
.mh-sub{font-size:15px;color:var(--dim);max-width:640px;line-height:1.8}
.mh-stats{display:flex;align-items:center;gap:36px;margin-top:38px;flex-wrap:wrap}
.mh-item{display:flex;flex-direction:column;gap:4px}
.mh-num{font:600 30px/1.1 var(--serif);color:var(--ink)}
.mh-label{font-size:13px;color:var(--dim)}
.mh-div{width:1px;height:38px;background:var(--line)}

.tools{display:flex;gap:12px;flex-wrap:wrap;padding:26px 0;align-items:center}
input[type=search],select{font:inherit;padding:12px 16px;border:1px solid var(--line);
 border-radius:8px;background:var(--card);color:var(--ink);outline:none;font-size:14px}
input[type=search]{flex:1;min-width:240px}
input[type=search]:focus,select:focus{border-color:var(--accent)}
select{cursor:pointer}

.docs{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.doc{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;
 display:flex;flex-direction:column;transition:.15s}
.doc:hover{border-color:var(--accent);transform:translateY(-2px);
 box-shadow:0 8px 22px rgba(28,25,23,.07)}
.doc .cv{aspect-ratio:16/10;background:var(--soft);overflow:hidden;display:block}
.doc .cv img{width:100%;height:100%;object-fit:cover;display:block}
.doc .no{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
 color:var(--faint);font-size:12.5px;background:var(--soft)}
.doc .b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.doc .au{font-size:12px;color:var(--accent);font-weight:500;letter-spacing:.01em}
.doc .ti{font:600 15.5px/1.6 var(--serif);color:var(--ink);text-decoration:none;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc .ti:hover{text-decoration:none}
.doc .mt{margin-top:auto;font-size:12.5px;color:var(--faint)}
mark{background:#FDE9D3;color:inherit;padding:0 1px;border-radius:2px}

.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
.cnt{font-size:13px;color:var(--dim);font-weight:400}
.lst-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.lst-hd h2{font:600 17px var(--serif)}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px;
 padding:26px 0 30px;text-align:center;margin-top:40px}

@media(max-width:640px){
 .wrap{padding:0 20px 30px}
 .mh-title{font-size:32px}
 .mh-stats{gap:20px;margin-top:28px}
 .mh-num{font-size:24px}
 nav.nav{gap:18px}
}
</style></head><body><div class="wrap">
<header class="top">
  <a class="brand" href="index.html">
    <span class="mark"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 2.5C4.31 2.5 3.75 3.06 3.75 3.75V16.25C3.75 16.94 4.31 17.5 5 17.5H15C15.69 17.5 16.25 16.94 16.25 16.25V3.75C16.25 3.06 15.69 2.5 15 2.5H5Z" stroke="white" stroke-width="1.5"/><path d="M6.5 6.5H13.5M6.5 9.5H13.5M6.5 12.5H10" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <span class="nm">抖音逐字稿库</span>
  </a>
  <span class="sp"></span>
  <nav class="nav">
    <a class="on" href="index.html">全部</a>
    <a href="authors.html">按主播</a>
    <a href="index.html#kw">关键词</a>
  </nav>
</header>

<div class="masthead">
  <h1 class="mh-title">读懂每一场直播</h1>
  <p class="mh-sub">13 位博主的直播内容，全部转写为可检索的文字档案 —— 逐字稿、内容总结与关键词均可搜索，由本地 Whisper + LLM 流水线生成。</p>
  <div class="mh-stats">
    <div class="mh-item"><span class="mh-num" id="s-docs">—</span><span class="mh-label">篇逐字稿</span></div>
    <div class="mh-div"></div>
    <div class="mh-item"><span class="mh-num" id="s-authors">—</span><span class="mh-label">位主播</span></div>
    <div class="mh-div"></div>
    <div class="mh-item"><span class="mh-num" id="s-chars">—</span><span class="mh-label">总字数</span></div>
    <div class="mh-div"></div>
    <div class="mh-item"><span class="mh-num" id="s-kw">—</span><span class="mh-label">个关键词</span></div>
  </div>
</div>

<div class="tools">
  <input type="search" id="q" placeholder="搜索标题 / 主播 / 关键词（正文深搜，命中数实时增加）" autocomplete="off">
  <select id="au"><option value="">全部主播</option></select>
  <select id="kw"><option value="">全部关键词</option></select>
  <select id="so">
    <option value="date">最新优先</option>
    <option value="chars">字数最多</option>
    <option value="title">标题 A→Z</option>
  </select>
</div>

<div class="lst-hd">
  <h2>逐字稿</h2>
  <span class="cnt" id="cnt"></span>
</div>

<div class="docs" id="list"></div>
<div class="empty" id="none" style="display:none">没有匹配的逐字稿</div>

<footer>逐字稿由公开视频音频自动转写生成 · 仅供个人学习与内容研究 · 版权归原作者及平台所有</footer>

<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hl(text, kw){
  if(!kw) return esc(text);
  try{
    var re = new RegExp('('+kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc(text).replace(re,'<mark>$1</mark>');
  }catch(e){return esc(text);}
}
function fmtChars(n){
  n = Number(n)||0;
  return n >= 10000 ? (n/10000).toFixed(1) + '万' : String(n);
}
function coverHtml(d){
  return d.cover
    ? '<a class="cv" href="doc.html?id='+encodeURIComponent(d.id)+'"><img loading="lazy" src="'+d.cover+'" alt=""></a>'
    : '<a class="no" href="doc.html?id='+encodeURIComponent(d.id)+'">无封面</a>';
}
function docHtml(d, kw){
  return '<article class="doc">'+coverHtml(d)+
   '<div class="b"><span class="au">'+hl(d.author,kw)+'</span>'+
   '<a class="ti" href="doc.html?id='+encodeURIComponent(d.id)+'">'+hl(d.title,kw)+'</a>'+
   '<div class="mt">'+esc(d.date)+' · 约 '+fmtChars(d.chars)+' 字'+
   (d.keywords&&d.keywords[0]?' · '+esc(d.keywords[0]):'')+'</div></div></article>';
}

var DATA=null, LIST=[], q='', au='', kw='', bodyHits=null, scanning=false;
var $=function(id){return document.getElementById(id);};

fetch('data/index.json').then(function(r){return r.json();}).then(function(d){
  DATA=d; LIST=d.docsList;
  $('s-docs').textContent=(d.docs||LIST.length).toLocaleString();
  $('s-authors').textContent=d.authors||(d.authorList&&d.authorList.length)||0;
  $('s-chars').textContent=fmtChars(d.chars);
  $('s-kw').textContent=(d.keywords?d.keywords.length:0).toLocaleString();
  var auSel=$('au');
  (d.authorList||[]).forEach(function(a){
    var o=document.createElement('option'); o.value=a.name; o.textContent=a.name+' ('+a.docs+')';
    auSel.appendChild(o);
  });
  var kwSel=$('kw');
  (d.keywords||[]).slice(0,400).forEach(function(k){
    var o=document.createElement('option'); o.value=k; o.textContent=k;
    kwSel.appendChild(o);
  });
  var m=location.search.match(/[?&]au=([^&]+)/);
  if(m){ au=decodeURIComponent(m[1]); auSel.value=au; }
  m=location.search.match(/[?&]kw=([^&]+)/);
  if(m){ kw=decodeURIComponent(m[1]); kwSel.value=kw; }
  bind(); render();
}).catch(function(e){
  $('none').style.display='';
  $('none').textContent='索引加载失败：'+e;
});

function bind(){
  var t;
  $('q').addEventListener('input',function(){
    clearTimeout(t); var v=this.value.trim();
    t=setTimeout(function(){ q=v.toLowerCase(); bodyHits=null; render(); scanBody(); },200);
  });
  $('au').addEventListener('change',function(){ au=this.value; bodyHits=null; render(); scanBody(); });
  $('kw').addEventListener('change',function(){ kw=this.value; bodyHits=null; render(); scanBody(); });
  $('so').addEventListener('change',render);
  if(location.hash==='#kw') $('kw').focus();
}

function matchMeta(d){
  if(au && d.author!==au) return false;
  if(kw && (d.keywords||[]).indexOf(kw)<0) return false;
  if(!q) return true;
  if(d.title.toLowerCase().indexOf(q)>=0) return true;
  if(d.author.toLowerCase().indexOf(q)>=0) return true;
  if((d.keywords||[]).some(function(k){return k.toLowerCase().indexOf(q)>=0;})) return true;
  if(d.snippet && d.snippet.toLowerCase().indexOf(q)>=0) return true;
  return false;
}

var scanList=null, scanTimer=null;
function scanBody(){
  if(!q){ bodyHits=null; return; }
  scanList=LIST.filter(function(d){
    return (!au||d.author===au) && (!kw||(d.keywords||[]).indexOf(kw)>=0);
  });
  scanning=true;
  clearTimeout(scanTimer);
  scanStep();
}
var CHUNK=12;
function scanStep(){
  if(!scanning||!scanList||!scanList.length){ scanning=false; return; }
  var batch=scanList.splice(0,CHUNK);
  Promise.all(batch.map(function(d){
    return fetch('data/docs/'+d.id+'.json')
      .then(function(r){return r.ok?r.json():null;})
      .then(function(x){
        if(!x) return;
        if(x.summary && x.summary.toLowerCase().indexOf(q)>=0){ bodyHits=bodyHits||{}; bodyHits[d.id]='summary'; }
        else if(x.transcript && x.transcript.toLowerCase().indexOf(q)>=0){ bodyHits=bodyHits||{}; bodyHits[d.id]='transcript'; }
      })
      .catch(function(){});
  })).then(function(){ render(); scanStep(); });
}

function match(d){
  if(!matchMeta(d)) return false;
  if(q && bodyHits && !bodyHits[d.id]) return false;
  return true;
}
function render(){
  var so=$('so').value;
  var out=LIST.filter(match);
  out.sort(function(a,b){
    if(so==='chars') return b.chars-a.chars;
    if(so==='title') return a.title.localeCompare(b.title,'zh');
    return (a.date<b.date?1:a.date>b.date?-1:0);
  });
  var box=$('list');
  $('cnt').textContent=out.length+' 篇'+(scanning?'（正文中…）':'');
  $('none').style.display=out.length?'none':'';
  box.innerHTML=out.slice(0,600).map(function(d){return docHtml(d,q);}).join('');
  if(out.length>600){
    var n=document.createElement('div');
    n.className='empty'; n.textContent='仅显示前 600 篇，请继续输入关键词缩小范围';
    box.appendChild(n);
  }
}
</script></div></body></html>
