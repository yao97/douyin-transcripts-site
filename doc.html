<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐字稿 · 抖音逐字稿库</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FAF9F6; --card:#fff; --line:#E7E5E4; --ink:#1C1917;
  --dim:#78716C; --faint:#A8A29E; --accent:#B45309; --soft:#F3F1EC;
  --serif:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
body{background:var(--paper);color:var(--ink);font:15px/1.7 var(--sans);
 -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 48px 40px}

header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;height:76px;
 border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:inherit}
.brand:hover{text-decoration:none}
.brand .mark{width:34px;height:34px;background:var(--accent);border-radius:8px;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .nm{font:600 19px var(--serif);color:var(--ink);letter-spacing:.01em}
header.top .sp{flex:1}
nav.nav{display:flex;gap:26px;align-items:center}
nav.nav a{font-size:14px;color:var(--dim);text-decoration:none}
nav.nav a:hover{color:var(--ink);text-decoration:none}
nav.nav a.on{color:var(--accent);font-weight:500}

.crumb{font-size:13px;color:var(--dim);padding:20px 0 0}
.crumb a{color:var(--accent)}

.art-head{padding:26px 0 34px;border-bottom:1px solid var(--line);display:flex;gap:28px;flex-wrap:wrap}
.ah-cv{flex:0 0 280px}
.ah-cv img{width:100%;border-radius:8px;border:1px solid var(--line);display:block}
.ah-info{flex:1;min-width:280px}
.ah-info h1{font:700 27px/1.4 var(--serif);letter-spacing:-.01em;margin-bottom:12px}
.ah-meta{color:var(--dim);font-size:14px;margin-bottom:14px}
.kws{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.kw{background:var(--soft);border-radius:4px;padding:3px 10px;font-size:12px;color:var(--dim)}
.kw:hover{background:#F5E6D3;color:var(--accent);text-decoration:none}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 16px;border:1px solid var(--line);border-radius:8px;
 background:var(--card);color:var(--ink);font-size:14px;transition:.15s}
.btn:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.primary:hover{background:#9A4708;border-color:#9A4708;color:#fff}

.reader{max-width:720px;margin:0 auto;padding:34px 0 0}
.sec{font:600 18px var(--serif);color:var(--ink);margin-bottom:16px;
 display:flex;align-items:baseline;gap:8px}
.cnt{font-size:12.5px;color:var(--faint);font-weight:400}
#sm{font-size:15px;line-height:1.85}
#sm h3{font:600 16.5px var(--serif);margin:20px 0 8px;color:var(--ink)}
#sm h4{font:600 15px var(--sans);margin:14px 0 6px;color:var(--ink)}
#sm li{margin:5px 0 5px 20px;display:list-item;list-style:disc}
#sm p{color:var(--dim)}
#tr{font-size:15.5px;line-height:2;white-space:pre-wrap;padding-bottom:20px}
mark{background:#FDE9D3;color:inherit;padding:0 1px;border-radius:2px}
.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px;
 padding:26px 0 30px;text-align:center;margin-top:40px}

@media(max-width:640px){
 .wrap{padding:0 20px 30px}
 .ah-info h1{font-size:22px}
 .ah-cv{flex:0 0 100%}
 .reader{padding:26px 0 0}
 nav.nav{gap:18px}
}
</style></head><body><div class="wrap">
<header class="top">
  <a class="brand" href="index.html">
    <span class="mark"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 2.5C4.31 2.5 3.75 3.06 3.75 3.75V16.25C3.75 16.94 4.31 17.5 5 17.5H15C15.69 17.5 16.25 16.94 16.25 16.25V3.75C16.25 3.06 15.69 2.5 15 2.5H5Z" stroke="white" stroke-width="1.5"/><path d="M6.5 6.5H13.5M6.5 9.5H13.5M6.5 12.5H10" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <span class="nm">抖音逐字稿库</span>
  </a>
  <span class="sp"></span>
  <nav class="nav">
    <a href="index.html">全部</a>
    <a href="authors.html">按主播</a>
    <a href="index.html#kw">关键词</a>
  </nav>
</header>

<div class="crumb" id="crumb"></div>

<div class="art-head">
  <span class="ah-cv" id="cv"><img id="cvi" alt=""></span>
  <div class="ah-info">
    <h1 id="ti"></h1>
    <div class="ah-meta" id="mt"></div>
    <div class="kws" id="kws"></div>
    <div class="acts">
      <a class="btn primary" id="dl" download>下载 md 原文</a>
      <a class="btn" id="vd" target="_blank" rel="noopener">抖音原视频</a>
      <a class="btn" id="hm" target="_blank" rel="noopener">主播主页</a>
      <a class="btn" id="nx" rel="noopener">下一篇</a>
    </div>
  </div>
</div>

<div class="reader">
  <h2 class="sec">内容总结 <span class="cnt" id="sl"></span></h2>
  <div id="sm"></div>
</div>

<div class="reader">
  <h2 class="sec">逐字稿 <span class="cnt" id="tc"></span></h2>
  <div id="tr"></div>
</div>

<div class="empty" id="none" style="display:none">未找到该逐字稿</div>

<footer>逐字稿由公开视频音频自动转写生成 · 仅供个人学习与内容研究 · 版权归原作者及平台所有</footer>

<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtChars(n){
  n=Number(n)||0;
  return n>=10000 ? (n/10000).toFixed(1)+'万' : String(n);
}
function md2html(s){
  return esc(s)
    .replace(/^### (.+)$/gm, '<h4>$1</h4>')
    .replace(/^## (.+)$/gm, '<h3>$1</h3>')
    .replace(/^- (.+)$/gm, '<li>$1</li>');
}
function $(id){return document.getElementById(id);}

var mm=location.search.match(/[?&]id=([^&]+)/);
if(!mm){ $('none').textContent='缺少 id 参数'; $('none').style.display=''; }
else {
  var wantId=decodeURIComponent(mm[1]);
  fetch('data/index.json').then(function(r){return r.json();}).then(function(d){
    var doc=null;
    for(var j=0;j<d.docsList.length;j++){ if(d.docsList[j].id===wantId){ doc=d.docsList[j]; break; } }
    if(!doc){ $('none').textContent='未找到该逐字稿'; $('none').style.display=''; return; }
    var i=d.docsList.indexOf(doc);
    document.title=doc.title+' · 抖音逐字稿库';
    $('crumb').innerHTML='<a href="index.html">全部</a> › <a href="index.html?au='+
      encodeURIComponent(doc.author)+'">'+esc(doc.author)+'</a>';
    $('ti').textContent=doc.title;
    $('mt').textContent=doc.author+' · '+doc.date+' · 约 '+fmtChars(doc.chars)+' 字';
    $('kws').innerHTML=(doc.keywords||[]).map(function(k){
      return '<a class="kw" href="index.html?kw='+encodeURIComponent(k)+'">'+esc(k)+'</a>';
    }).join('');
    if(doc.cover){ $('cvi').src=doc.cover; }
    else { $('cv').style.display='none'; }
    $('dl').href='transcripts/'+doc.id+'.md';
    var vd=$('vd'); if(doc.videoUrl) vd.href=doc.videoUrl; else vd.style.display='none';
    var hm=$('hm'); if(doc.homeUrl) hm.href=doc.homeUrl; else hm.style.display='none';
    var nx=$('nx');
    var prev=d.docsList[i-1];
    nx.href=prev ? 'doc.html?id='+encodeURIComponent(prev.id) : 'index.html';
    nx.textContent=prev ? '下一篇：'+prev.title.slice(0,16) : '回到列表';
    $('tc').textContent='约 '+fmtChars(doc.chars)+' 字';
    $('sl').textContent='加载中…';
    if(doc.snippet) $('sm').innerHTML='<p>'+esc(doc.snippet)+'</p>';
    $('tr').textContent='正文加载中…';
    $('none').style.display='none';
    window.scrollTo(0,0);
    fetch('data/docs/'+doc.id+'.json').then(function(r){return r.json();}).then(function(x){
      $('sl').textContent='';
      $('sm').innerHTML=md2html(x.summary||'');
      $('tr').textContent=x.transcript||'（无逐字稿）';
    }).catch(function(){
      $('sl').textContent='';
      $('tr').innerHTML='<span style="color:var(--dim)">正文加载失败，可点上方「下载 md 原文」。</span>';
    });
  }).catch(function(e){
    $('none').style.display='';
    $('none').textContent='索引加载失败：'+e;
  });
}
</script></div></body></html>
