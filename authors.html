<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>按主播 · 抖音逐字稿库</title><style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#FAF9F6; --card:#fff; --line:#E7E5E4; --ink:#1C1917;
  --dim:#78716C; --faint:#A8A29E; --accent:#B45309; --soft:#F3F1EC;
  --serif:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
body{background:var(--paper);color:var(--ink);font:15px/1.7 var(--sans);
 -webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1120px;margin:0 auto;padding:0 48px 40px}

header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;height:76px;
 border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:inherit}
.brand:hover{text-decoration:none}
.brand .mark{width:34px;height:34px;background:var(--accent);border-radius:8px;
 display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.brand .nm{font:600 19px var(--serif);color:var(--ink);letter-spacing:.01em}
header.top .sp{flex:1}
nav.nav{display:flex;gap:26px;align-items:center}
nav.nav a{font-size:14px;color:var(--dim);text-decoration:none}
nav.nav a:hover{color:var(--ink);text-decoration:none}
nav.nav a.on{color:var(--accent);font-weight:500}

.masthead{padding:58px 0 42px;border-bottom:1px solid var(--line)}
.mh-title{font:700 46px/1.28 var(--serif);letter-spacing:-.02em;margin-bottom:14px}
.mh-sub{font-size:15px;color:var(--dim);max-width:640px;line-height:1.8}
.mh-stats{display:flex;align-items:center;gap:36px;margin-top:38px;flex-wrap:wrap}
.mh-item{display:flex;flex-direction:column;gap:4px}
.mh-num{font:600 30px/1.1 var(--serif);color:var(--ink)}
.mh-label{font-size:13px;color:var(--dim)}
.mh-div{width:1px;height:38px;background:var(--line)}

.lst-hd{display:flex;align-items:baseline;gap:10px;margin:26px 0 16px}
.lst-hd h2{font:600 17px var(--serif)}
.cnt{font-size:13px;color:var(--dim);font-weight:400}

.authors{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.author{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;
 display:flex;flex-direction:column;transition:.15s;color:inherit}
.author:hover{border-color:var(--accent);transform:translateY(-2px);
 box-shadow:0 8px 22px rgba(28,25,23,.07);text-decoration:none}
.author .cv{aspect-ratio:16/10;background:var(--soft);overflow:hidden;display:block}
.author .cv img{width:100%;height:100%;object-fit:cover;display:block}
.author .no{aspect-ratio:16/10;background:var(--soft);display:flex;align-items:center;
 justify-content:center;color:var(--faint);font-size:12.5px}
.author .b{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.author .n{font:600 17px var(--serif);color:var(--ink)}
.author .m{font-size:13px;color:var(--dim);line-height:1.7}
.author .avs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.author .avs img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.author .lk{font-size:13px;color:var(--accent);font-weight:500;margin-top:auto;padding-top:4px}
mark{background:#FDE9D3;color:inherit;padding:0 1px;border-radius:2px}
.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:13px;
 padding:26px 0 30px;text-align:center;margin-top:40px}

@media(max-width:640px){
 .wrap{padding:0 20px 30px}
 .mh-title{font-size:32px}
 .mh-stats{gap:20px;margin-top:28px}
 .mh-num{font-size:24px}
 nav.nav{gap:18px}
}
</style></head><body><div class="wrap">
<header class="top">
  <a class="brand" href="index.html">
    <span class="mark"><svg width="19" height="19" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 2.5C4.31 2.5 3.75 3.06 3.75 3.75V16.25C3.75 16.94 4.31 17.5 5 17.5H15C15.69 17.5 16.25 16.94 16.25 16.25V3.75C16.25 3.06 15.69 2.5 15 2.5H5Z" stroke="white" stroke-width="1.5"/><path d="M6.5 6.5H13.5M6.5 9.5H13.5M6.5 12.5H10" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg></span>
    <span class="nm">抖音逐字稿库</span>
  </a>
  <span class="sp"></span>
  <nav class="nav">
    <a href="index.html">全部</a>
    <a class="on" href="authors.html">按主播</a>
    <a href="index.html#kw">关键词</a>
  </nav>
</header>

<div class="masthead">
  <h1 class="mh-title">按主播浏览</h1>
  <p class="mh-sub">13 位博主的逐字稿档案，按内容体量排列 —— 点击任一主播卡片，查看其全部转写内容。</p>
  <div class="mh-stats">
    <div class="mh-item"><span class="mh-num" id="s-docs">—</span><span class="mh-label">篇逐字稿</span></div>
    <div class="mh-div"></div>
    <div class="mh-item"><span class="mh-num" id="s-authors">—</span><span class="mh-label">位主播</span></div>
    <div class="mh-div"></div>
    <div class="mh-item"><span class="mh-num" id="s-chars">—</span><span class="mh-label">总字数</span></div>
    <div class="mh-div"></div>
    <div class="mh-item"><span class="mh-num" id="s-kw">—</span><span class="mh-label">个关键词</span></div>
  </div>
</div>

<div class="lst-hd">
  <h2>主播</h2>
  <span class="cnt" id="cnt"></span>
</div>

<div class="authors" id="grid"></div>
<div class="empty" id="none" style="display:none">未加载到主播数据</div>

<footer>逐字稿由公开视频音频自动转写生成 · 仅供个人学习与内容研究 · 版权归原作者及平台所有</footer>

<script>
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmtChars(n){
  n=Number(n)||0;
  return n>=10000 ? (n/10000).toFixed(1)+'万' : String(n);
}
var $=function(id){return document.getElementById(id);};

fetch('data/index.json').then(function(r){return r.json();}).then(function(d){
  $('s-docs').textContent=(d.docs||0).toLocaleString();
  $('s-authors').textContent=d.authors||(d.authorList&&d.authorList.length)||0;
  $('s-chars').textContent=fmtChars(d.chars);
  $('s-kw').textContent=(d.keywords?d.keywords.length:0).toLocaleString();

  var list=d.authorList||[];
  $('cnt').textContent=list.length+' 位';
  $('grid').innerHTML=list.map(function(a){
    var cv=(a.covers&&a.covers[0])||a.cover;
    var cover=cv
      ? '<span class="cv"><img loading="lazy" src="'+cv+'" alt=""></span>'
      : '<span class="no">无封面</span>';
    var avs=(a.covers||[]).slice(0,4).map(function(c){
      return '<img loading="lazy" src="'+c+'" alt="">';
    }).join('');
    return '<a class="author" href="index.html?au='+encodeURIComponent(a.name)+'">'+cover+
      '<div class="b"><span class="n">'+esc(a.name)+'</span>'+
      '<span class="m">'+a.docs+' 篇 · 约 '+fmtChars(a.chars)+' 字 · 最早 '+esc(a.first)+' · 最新 '+esc(a.last)+'</span>'+
      (avs?'<span class="avs">'+avs+'</span>':'')+
      (a.homeUrl?'<span class="lk">抖音主页 →</span>':'')+
      '</div></a>';
  }).join('');
  $('none').style.display = list.length ? 'none' : '';
  // 兼容 query 直达
  var m=location.search.match(/[?&]au=([^&]+)/);
  if(m){ location.href='index.html?au='+m[1]; }
}).catch(function(e){
  $('none').style.display='';
  $('none').textContent='索引加载失败：'+e;
});
</script></div></body></html>
